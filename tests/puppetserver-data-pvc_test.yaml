suite: test puppet data volume creation
templates:
  - puppetserver-data-pvc.yaml
release:
  name: puppetserver
  namespace: puppet
tests:
  - it: manifest should match snapshot
    set:
      puppetserver.persistence.data.existingClaim: dummy
    asserts:
      - matchSnapshot: {}
  - it: should not create the volume if "puppetserver.persistence.data.existingClaim" is non-empty
    set:
      puppetserver.persistence.data.existingClaim: dummy
    asserts:
      - hasDocuments:
          count: 0
  - it: should create the volume if "puppetserver.persistence.data.enabled" is true and "puppetserver.persistence.data.existingClaim" is empty
    set:
      puppetserver.persistence.data.enabled: true
      puppetserver.persistence.data.existingClaim: ""
    asserts:
      - isKind:
          of: PersistentVolumeClaim
  - it: should not create the volume by default
    asserts:
      - hasDocuments:
          count: 0